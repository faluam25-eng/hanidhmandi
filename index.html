<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات لحدي السلة - محلي / سفري / توصيل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap');
*{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#fdf8ef;padding:14px;color:#2b2216}
.header{text-align:center;background:#fff;border:2px solid #c5a059;border-radius:20px;padding:18px}
.header h1{color:#9c7a3c}
.types{display:flex;gap:10px;margin:14px 0}
.types button{flex:1;padding:14px;border-radius:14px;border:2px solid #c5a059;background:#fff;font-weight:800;cursor:pointer}
.types button.active{background:#c5a059;color:#fff}
.menu{display:grid;gap:10px;margin-top:10px}
.item{background:#fff;padding:12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0001}
.item button{background:#c5a059;color:#fff;border:none;padding:7px 12px;border-radius:10px}
.cart{position:sticky;bottom:10px;background:linear-gradient(135deg,#d4b072,#9c7a3c);color:#fff;padding:14px;border-radius:16px;display:flex;justify-content:space-between;margin-top:18px}
.pay{background:#fff;padding:16px;border-radius:18px;margin-top:14px;border:1px solid #e8d9b8;display:none}
.pay h3{color:#9c7a3c;margin-bottom:10px}
.opt{border:1px solid #e8d9b8;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between}
.opt.active{background:#fdf6e6;border-color:#c5a059}
.iban-box{background:#fdf6e6;border:1px dashed #c5a059;padding:12px;border-radius:12px;margin:12px 0;text-align:center;display:none}
.iban-box b{letter-spacing:1px}
</style>
</head>
<body>

<div class="header">
<h1>الطلبات لحدي السلة</h1>
<p>رقم الطلبات: 0530211999 | شكاوى: 0593706625</p>
<div class="types">
<button id="b-m" class="active" onclick="setType('محلي')">🍽️ محلي</button>
<button id="b-s" onclick="setType('سفري')">🛍️ سفري</button>
<button id="b-t" onclick="setType('توصيل')">🛵 توصيل</button>
</div>
<p id="typeText">نوع الطلب: محلي</p>
</div>

<div class="menu" id="menuList"></div>

<div class="cart">
<div><span id="cnt">0</span> صنف - <span id="tot">0</span> ر.س</div>
<button onclick="openPay()" style="background:#fff;color:#9c7a3c;border:none;padding:8px 16px;border-radius:10px;font-weight:800">إتمام الطلب</button>
</div>

<div class="pay" id="payBox">
<h3 id="payTitle">طريقة الدفع - محلي</h3>
<div id="payOptions"></div>

<div class="iban-box" id="ibanBox">
<p>حول المبلغ على الآيبان التالي:</p>
<b id="ibanNumber">SA00 0000 0000 0000 0000 0000</b><br>
<button onclick="copyIban()" style="margin-top:8px;padding:6px 12px;border-radius:8px;border:none;background:#9c7a3c;color:#fff">نسخ الآيبان</button>
<p style="margin-top:10px;font-size:12px">بعد التحويل أرفق صورة الإيصال واتساب 0530211999</p>
</div>

<button onclick="confirmOrder()" style="width:100%;background:#9c7a3c;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:10px">تأكيد الطلب</button>
</div>

<script>
// حط رقم الآيبان الحقيقي هنا
const IBAN = "SA00 0000 0000 0000 0000 0000"; 
document.getElementById('ibanNumber').innerText = IBAN;

const items = [
{n:"تيس حنيذ",p:1550},{n:"نصف تيس حنيذ",p:790},{n:"ربع تيس حنيذ",p:398},
{n:"نفر لحم مندي",p:95},{n:"نفر مضغوط",p:55},{n:"حمص",p:13},{n:"تبولة",p:17},{n:"كنافة",p:10},{n:"بيبسي",p:3}
];
let cart=[],sum=0,orderType='محلي',payMethod='';

const list = document.getElementById('menuList');
items.forEach((it,i)=>{
list.innerHTML+=`<div class="item"><div><b>${it.n}</b><div>${it.p} ر.س</div></div><button onclick="addItem(${i})">+ إضافة</button></div>`
});

function addItem(i){cart.push(items[i]);sum+=items[i].p;document.getElementById('cnt').innerText=cart.length;document.getElementById('tot').innerText=sum}
function setType(t){
orderType=t;
document.getElementById('typeText').innerText='نوع الطلب: '+t;
document.querySelectorAll('.types button').forEach(b=>b.classList.remove('active'));
document.getElementById(t=='محلي'?'b-m':t=='سفري'?'b-s':'b-t').classList.add('active');
renderPay();
}
function renderPay(){
const box=document.getElementById('payOptions');
const ibanBox=document.getElementById('ibanBox');
box.innerHTML='';
if(orderType=='محلي'){
document.getElementById('payTitle').innerText='طريقة الدفع - محلي';
ibanBox.style.display='none';
box.innerHTML=`
<div class="opt active" onclick="sel(this,'كاش')"><span>💵 كاش</span><span>✔️</span></div>
<div class="opt" onclick="sel(this,'شبكة')"><span>💳 شبكة</span><span></span></div>`;
payMethod='كاش';
}else{
document.getElementById('payTitle').innerText='طريقة الدفع - سفري / توصيل';
ibanBox.style.display='block';
box.innerHTML=`
<div class="opt active" onclick="sel(this,'تحويل بنكي')"><span>🏦 تحويل بنكي - IBAN</span><span>✔️</span></div>`;
payMethod='تحويل بنكي';
}
}
function sel(el,method){document.querySelectorAll('.opt').forEach(o=>{o.classList.remove('active');o.querySelector('span:last-child').innerText=''});el.classList.add('active');el.querySelector('span:last-child').innerText='✔️';payMethod=method;}
function openPay(){if(cart.length==0){alert('السلة فاضية');return;}renderPay();document.getElementById('payBox').style.display='block';window.scrollTo(0,document.body.scrollHeight)}
function copyIban(){navigator.clipboard.writeText(IBAN);alert('تم نسخ الآيبان: '+IBAN)}
function confirmOrder(){alert(`تم تأكيد الطلب\nالنوع: ${orderType}\nالدفع: ${payMethod}\nالمجموع: ${sum} ر.س\n${orderType!='محلي'?'الآيبان: '+IBAN:''}\nأرسل الإيصال واتساب 0530211999`)}
renderPay();
</script>
</body>
</html>
