<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدرستي - وزارة التربية ولاية الجزيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:Cairo;box-sizing:border-box}
body{margin:0;display:flex;min-height:100vh;background:#f4f6f9}
.right{flex:1;background:linear-gradient(180deg,#0a8a3a,#000,#d10a10);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;position:relative}
.right::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.3)}
.right *{position:relative;z-index:2}
.left{flex:1;background:#fff;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:420px}
.tabs{display:flex;background:#f1f3f6;border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:none;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;color:#666}
.tabs button.active{background:#0a8a3a;color:#fff}
.input{width:100%;padding:14px;border:1.5px solid #e0e0e0;border-radius:12px;margin:8px 0;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#0a8a3a;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.btn2{background:#111}
.otp-box{display:none;background:#fffbe6;border:2px dashed #f7c400;padding:14px;border-radius:12px;margin-top:12px;text-align:center}
.timer{font-weight:800;color:#d10a10;font-size:18px}
.support{margin-top:20px;background:#f8fdf9;border:1px solid #d6f0dc;border-radius:12px;padding:12px;text-align:center}
@media(max-width:700px){body{flex-direction:column}.left{order:1}.right{order:2;padding:20px}}
</style>
</head>
<body>
<div class="right">
<div style="width:100px;height:100px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:45px;border:4px solid #f7c400">🎓</div>
<h1>مدرستي</h1>
<p>وزارة التربية والتعليم - ولاية الجزيرة</p>
<div style="background:#fff;color:#0a8a3a;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-top:8px">منصة إدارة المدارس الإلكترونية</div>
</div>
<div class="left">
<div class="card">
<div class="tabs">
<button id="t2" class="active" onclick="tab(2)">تسجيل مدرسة</button>
<button id="t1" onclick="tab(1)">دخول</button>
</div>
<div id="register">
<input class="input" id="sName" placeholder="اسم المدرسة">
<input class="input" id="sPhone" placeholder="جوال 249xxxxxxxxx">
<input class="input" id="sEmail" placeholder="بريد المدرسة">
<button class="btn" onclick="sendCode()">إرسال كود التأكيد</button>
<div class="otp-box" id="otpBox">
<input class="input" id="otp" placeholder="كود 6 أرقام" maxlength="6" style="text-align:center;letter-spacing:5px;font-weight:800">
<div class="timer" id="timer">02:00</div>
<button class="btn btn2" onclick="verify()">تأكيد التسجيل</button>
</div>
</div>
<div id="login" style="display:none">
<input class="input" id="lPhone" placeholder="رقم الجوال 249xxxxxxxxx">
<input class="input" id="lPass" type="password" placeholder="كلمة المرور">
<button class="btn btn2" onclick="login()">دخول</button>
</div>
<div class="support">🛠️ الدعم الفني<br><a href="https://wa.me/249914542525" style="color:#0a8a3a;font-weight:800;text-decoration:none;font-size:18px">0914542525</a><br><small>وزارة التربية - الجزيرة - واتساب</small></div>
<p style="text-align:center;font-size:11px;color:#999;margin-top:10px">© 2026 مدرستي - السودان 🇸🇩</p>
</div>
</div>
<script>
let time=120,interval=null,code='';
function tab(n){t1.classList.toggle('active',n==1);t2.classList.toggle('active',n==2);login.style.display=n==1?'block':'none';register.style.display=n==2?'block':'none';}
function sendCode(){
 if(!sName.value||!sPhone.value||!sEmail.value){alert('أكمل البيانات');return}
 if(!sPhone.value.startsWith('249')){alert('لازم يبدأ بـ 249');return}
 code=Math.floor(100000+Math.random()*900000)+'';
 otpBox.style.display='block'; alert('كود التجربة: '+code); startTimer();
}
function startTimer(){clearInterval(interval);time=120;interval=setInterval(()=>{let m=Math.floor(time/60),s=time%60;timer.innerText=`0${m}:${s<10?'0'+s:s}`;if(time--<=0){clearInterval(interval);otpBox.style.display='none'}},1000)}
function verify(){otp.value==code?alert('تم تسجيل '+sName.value):alert('الكود خطأ')}
function login(){!lPhone.value.startsWith('249')?alert('لازم يبدأ بـ 249'):alert('تم الدخول')}
</script>
</body>
</html>
